buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // GTCEu patch 版以 files() 依赖接入，MixinGradle 不再自动扫描其 mixin 配置，
            // 手动注册（否则 GTCEu 的 AbstractRegistrateAccessor 等 mixin 不生效）
            args '--mixin.config', 'gtceu.mixins.json'

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Trust the Windows certificate store so the game can reach Mojang's
            // authentication servers through the Steamcommunity302 HTTPS proxy
            // (its CA certificate is installed in the Windows root store).
            property 'javax.net.ssl.trustStoreType', 'WINDOWS-ROOT'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// 显式注入 Mixin AP 参数生成 refmap（生产 SRG 环境必需）。
// mixingradle 0.7-SNAPSHOT 在本工程的 Gradle 8.8 下不会把 -A 参数注进 compileJava
// （compilerArgs 为空、refmap 从不生成，历史 jar 里的是旧残留文件），因此手动注入：
// AP 以绝对路径把 refmap 直接写进 classes 输出，jar 任务原样打包。
// 把 Mixin AP 产物 refmap 落进 classes 输出，jar 任务原样打包（生产 SRG 环境必需）。
// mixingradle 0.7-SNAPSHOT 在本工程会把 refmap 生成到 build/tmp/compileJava/，
// 但其 jar 注入钩子被 "sourceSet already added" 守卫吞掉不生效（根因未深究），
// 0.0.2 曾因此丢 refmap 在整合包崩溃（GuiGraphicsWaveCaptureMixin No refMap loaded）。
tasks.named('compileJava', JavaCompile).configure {
    doLast {
        def src = file("${layout.buildDirectory.get()}/tmp/compileJava/${mod_id}.refmap.json")
        def dst = file("${layout.buildDirectory.get()}/classes/java/main/${mod_id}.refmap.json")
        if (src.exists()) {
            java.nio.file.Files.copy(src.toPath(), dst.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle('GTNEcore: refmap 已打包 {} ({} 字节)', dst.name, src.length())
        } else {
            throw new GradleException("refmap 未生成: ${src}（Mixin AP 参数未生效？）")
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ===== GTCEu patch 层 =====
// 编译要覆盖进 gtceu 官方 jar 的类（com.gregtechceu.gtceu.*，official 映射，与
// deobf gtceu jar 同构）。产物 build/patched/gtceu-patch.jar，合并进 deobf jar
// 得到 patched gtceu jar（见 docs/api-material 或 patches/README）。
sourceSets {
    patch {
        java {
            srcDir 'src/patch/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
    }
}

tasks.register('patchJar', Jar) {
    archiveFileName = 'gtceu-patch.jar'
    destinationDirectory = file('build/patched')
    from sourceSets.patch.output
}

// ===== jarjar 发布（改版 GTCEu 嵌入主 mod jar）=====
// reobfJarJar 只重映射 gtnecore 自身类、不递归处理 META-INF/jarjar/ 里的嵌套 jar，
// 所以嵌入 jar 必须整体 srg 化后才能发布：
//   顶层 = maven 原始(srg) gtceu + reobfPatchJar(srg) 覆盖同名类
//   嵌套 = maven 原始(srg) gtceu 自带（Registrate/LDlib/mixinextras/configuration）
// dev 不受影响：仍用 deobf(official) patched jar（implementation files）。
jarJar.enable()

configurations {
    gtceuSrg // maven 原始 srg 版（未 fg.deobf），发布 jar 的底子
}

dependencies {
    gtceuSrg "com.gregtechceu.gtceu:gtceu-1.20.1:${gtm_version}"
}

def releaseGtceuJar = file('build/patched/gtceu-1.20.1-7.5.3-patched-release.jar')
def srgPatchJar = file('build/patched/gtceu-patch-official.jar') // reobfPatchJar in-place 改写后即 srg 版

// patch 类 official -> srg（与 reobfJar/reobfJarJar 同款：RenameJarInPlace + createMcpToSrg）
def srgPatchSource = file('build/patched/gtceu-patch-official.jar')

tasks.register('prepareSrgPatchSource', Copy) {
    dependsOn patchJar
    from patchJar.archiveFile
    into file('build/patched')
    rename { 'gtceu-patch-official.jar' }
}

tasks.register('reobfPatchJar', net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace) {
    dependsOn prepareSrgPatchSource, createMcpToSrg
    input.set(srgPatchSource) // in place：直接改写该文件
    mappings.set(tasks.named('createMcpToSrg', net.minecraftforge.gradle.mcp.tasks.GenerateSRG).flatMap { it.output })
    libraries.from(sourceSets.main.runtimeClasspath, sourceSets.patch.compileClasspath)
}

tasks.register('makeReleaseGtceuJar', Exec) {
    dependsOn reobfPatchJar
    inputs.files(configurations.gtceuSrg)
    inputs.file(srgPatchJar)
    inputs.file('scripts/make-release-jar.py')
    outputs.file(releaseGtceuJar)
    doFirst {
        def srgFile = configurations.gtceuSrg.singleFile
        commandLine 'python', file('scripts/make-release-jar.py').absolutePath,
                srgFile.absolutePath, srgPatchJar.absolutePath, releaseGtceuJar.absolutePath
    }
}

// flatDir 只认带版本的文件名：libs/gtceu-release-7.5.3.jar <-> blank:gtceu-release:7.5.3
// Gradle 在配置期解析 jarJar 依赖，任务产物赶不上——所以由 updateReleaseGtceuJar 手动同步，
// jarJar 执行前校验两者一致（patch 改动后必须重跑 updateReleaseGtceuJar，否则打包旧版）。
tasks.register('updateReleaseGtceuJar', Copy) {
    dependsOn makeReleaseGtceuJar
    from releaseGtceuJar
    into file('libs')
    rename { 'gtceu-release-7.5.3.jar' }
}

def sha256 = { File f ->
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { s ->
        def buf = new byte[8192]
        int n
        while ((n = s.read(buf)) != -1) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

tasks.named('jarJar') {
    doFirst {
        def libsJar = file('libs/gtceu-release-7.5.3.jar')
        if (!libsJar.exists()) {
            throw new GradleException("libs/gtceu-release-7.5.3.jar 不存在，先跑: ./gradlew updateReleaseGtceuJar")
        }
        if (sha256(libsJar) != sha256(releaseGtceuJar)) {
            throw new GradleException('libs/gtceu-release-7.5.3.jar 与最新 patched release 不一致（可能改了 patch），先跑: ./gradlew updateReleaseGtceuJar')
        }
    }
}

// ===== 开源 addon 强兼容版（二进制 patch）=====
// gregic_tinkering 是开源 mod（LGPL-3.0），编译时按 int[] 引用 GTValues.VA/VH/VHA；
// patch 后是 long[]，字段描述符 [I -> [J，直接放整合包会 NoSuchFieldError。
// tools/PatchGtseJar.java 用 ASM 改写：getstatic [I -> [J、iaload -> laload、删 i2l、i2d -> l2d。
// 用法: ./gradlew patchAllGtAddons  ->  build/patched/<name>-patched.jar（替换整合包原版）
configurations {
    asmTool
}

dependencies {
    asmTool 'org.ow2.asm:asm:9.5'
}

tasks.register('compilePatchGtseTool', JavaCompile) {
    source fileTree('tools') { include 'PatchGtseJar.java' }
    classpath = configurations.asmTool
    destinationDirectory = file('build/tools')
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

def gtAddonPatches = [
        'gregic_tinkering-1.3.0',
]

gtAddonPatches.forEach { name ->
    def inJar = file("libs/${name}.jar")
    def outJar = file("build/patched/${name}-patched.jar")
    tasks.register("patchGtAddon_${name.replaceAll('[^a-zA-Z0-9]', '_')}", JavaExec) {
        dependsOn compilePatchGtseTool
        classpath = files(file('build/tools'), configurations.asmTool)
        mainClass = 'PatchGtseJar'
        inputs.file(inJar)
        inputs.file('tools/PatchGtseJar.java')
        outputs.file(outJar)
        args inJar.absolutePath, outJar.absolutePath
    }
}

tasks.register('patchAllGtAddons') {
    dependsOn tasks.matching { it.name.startsWith('patchGtAddon_') }
}

// ===== shimmer dev 环境修补 =====
// shimmer.mixins.json 的 ProgramMixin 与 oculus 的 MixinProgram 都注入
// Program.compileShaderInternal，dev 环境崩 "The call compileShaderInternal is not cancellable"
// （0.2.4 与新版实测均崩，非版本问题）。PatchShimmerMixins 从 json 移除该 mixin，
// 其余功能保留；整合包（production）同样建议用 patch 版替换。
configurations {
    shimmerDeobf
}

dependencies {
    shimmerDeobf fg.deobf("curse.maven:shimmer-627824:8721415")
}

def shimmerPatchedOut = file('build/patched/shimmer-627824-8721415-mapped-patched.jar')

tasks.register('compilePatchShimmerTool', JavaCompile) {
    source fileTree('tools') { include 'PatchShimmerMixins.java' }
    classpath = files()
    destinationDirectory = file('build/tools')
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.register('patchShimmerDeobf', JavaExec) {
    dependsOn compilePatchShimmerTool, configurations.shimmerDeobf
    classpath = files(file('build/tools'))
    mainClass = 'PatchShimmerMixins'
    outputs.file(shimmerPatchedOut)
    doFirst {
        def mapped = configurations.shimmerDeobf.files.find {
            it.name.contains('shimmer') && it.name.contains('mapped')
        }
        if (mapped == null) throw new GradleException('找不到 shimmer mapped jar（fg.deobf 未产出？）')
        args mapped.absolutePath, shimmerPatchedOut.absolutePath
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    it.dependsOn('patchShimmerDeobf')
}

// 整合包版 patch（srg 原始 jar → build/patched/shimmer-627824-8721415-patched.jar）
def shimmerSrgIn = file('libs/shimmer-627824-8721415.jar')
def shimmerSrgOut = file('build/patched/shimmer-627824-8721415-patched.jar')
tasks.register('patchShimmerSrg', JavaExec) {
    dependsOn compilePatchShimmerTool
    classpath = files(file('build/tools'))
    mainClass = 'PatchShimmerMixins'
    inputs.file(shimmerSrgIn)
    outputs.file(shimmerSrgOut)
    args shimmerSrgIn.absolutePath, shimmerSrgOut.absolutePath
    onlyIf { shimmerSrgIn.exists() }
}

repositories {

    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // flatDir：GT 发布链（jarjar 嵌入版）所需的改版 GTCEu release jar 存放于此
    // （libs/gtceu-release-7.5.3.jar，由 updateReleaseGtceuJar 任务生成）
    flatDir {
        dir 'libs'
    }

    // JEI is hosted on the BlameJared Maven
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }

    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI (Just Enough Items) - soft dependency: API for compile-time, full mod at runtime
    // Using fg.deobf() ensures the dependency is remapped to the development mappings
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    //gtm —— GTNEcore patch 版（VH/VA/VHA 升级为 long[] 22 档真实值；由 patchJar 任务产出并合并）
    implementation files('build/patched/gtceu-1.20.1-7.5.3-patched.jar')
    // 发布嵌入（jarjar）：顶层 reobf 成 srg，嵌套已由 makeReleaseGtceuJar 换成 srg 原始版
    jarJar('blank:gtceu-release:7.5.3') {
        jarJar.ranged(it, '[7.5.3,)')
    }
    //Avaritia
    implementation fg.deobf("curse.maven:avaritia-623969:8497793")
    //mek —— 已移除（GTM↔Mek 化学联动暂停，Mek 化学品需专用管道交互，工作量与收益不匹配；恢复时按 GtnecoreAddon 注释）
    //jade
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_id}")
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_id}")
    // Registrate + LDlib (extracted from GTCEu's jarjar, same versions) - compile only;
    // at runtime GTCEu's jarjar provides the classes, so no duplicate loading
    // 注意：坐标必须用 blank:（flatDir 按 libs/<name>-<version>.jar 文件名匹配），
    // 写成 maven 坐标（com.tterrag.registrate / com.lowdragmc.ldlib）在 flatDir 里
    // 版本对不上、公共 maven 也没有，会直接解析失败
    compileOnly "blank:Registrate:1.3.11"
    compileOnly "blank:ldlib:1.0.40.b"
    //Goety（依赖 Curios）
    implementation fg.deobf("curse.maven:goety-586095:8647359")
    //curios
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    //Modern UI（波浪/双层文字的渲染管线兼容层使用；dev 环境加载以验证兼容性）
    implementation fg.deobf("curse.maven:modern-ui-352491:6956345")
    //Tinkers Construct
    implementation fg.deobf("curse.maven:tinkers-construct-74072:7449219")
    implementation fg.deobf("curse.maven:mantle-74924:7563777")
    // 2026-09-05 清理：botania/manafluid/ars/gec/patchouli 五条 curse.maven 声明为
    // 伪造/残留依赖（项目 id 重复 1214189:6285695，源码零引用，curse 源在本网络被墙），
    // 且对应 mapped 构件已不在本地缓存 → 移除以恢复可编译性。
    //shimmer（与 oculus mixin 冲突已由 PatchShimmerMixins 处理：移除 ProgramMixin。
    // dev 运行用 patchShimmerDeobf 产出的 mapped patch jar；整合包用 patchShimmerSrg 产物）
    runtimeOnly files('build/patched/shimmer-627824-8721415-mapped-patched.jar')
    //oculus
    implementation fg.deobf("curse.maven:oculus-581495:6020952")
    //oculus 前置：Embeddium（dev 环境必须——缺失时 oculus 渲染初始化静默崩溃，
    //进程死在 Render thread mixin 应用阶段且无任何 Java 错误/崩溃报告；
    //compileOnly 供 SodiumWorldRendererGuardMixin 的 @Shadow 编译期引用）
    compileOnly fg.deobf("blank:embeddium:0.3.31")
    runtimeOnly fg.deobf("blank:embeddium:0.3.31")
    //dev 辅助 mod（libs/ flatDir；整合包运行时由 mods 目录提供，这里仅本地测试环境）
    runtimeOnly fg.deobf("blank:modernfix:5.27.66")
    runtimeOnly fg.deobf("blank:jei-copy-recipe-json:1.1.2")
    //create
    implementation fg.deobf("curse.maven:create-328085:7178761")
    //ponder
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    //Create Repair
    implementation fg.deobf("curse.maven:create-repair-1477958:8382254")
    //ae2
    implementation fg.deobf("curse.maven:ae2-223794:7148487")
    implementation fg.deobf("curse.maven:guideme-1173950:8204776")
    //ad astra
    implementation fg.deobf("curse.maven:adastra-635042:6262032")
    implementation fg.deobf("curse.maven:botarium-704113:5486070")
    implementation fg.deobf("curse.maven:resourceful-config-714059:6231176")
    implementation fg.deobf("curse.maven:resourceful-lib-570073:5659871")
    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Lombok —— 仅 patch 层需要（GTCEu 源码大量使用 @Getter/@Setter/@RequiredArgsConstructor）
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    patchCompileOnly 'org.projectlombok:lombok:1.18.30'
    patchAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    // GTCEu 软依赖（patch 类可能引用，运行时由整合包 mods 提供）
    patchCompileOnly "appeng:appliedenergistics2-forge:15.4.9"
    patchCompileOnly "mcjty.theoneprobe:theoneprobe:1.20.1-10.0.1-3"

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // refmap 双来源（classes 输出副本 + mixingradle jar 注入钩子）撞车时取其一即可，
    // 内容一致
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
